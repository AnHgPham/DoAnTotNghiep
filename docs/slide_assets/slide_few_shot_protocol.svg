<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460">
  <defs>
    <style>
      .title{font-family:Barlow,Arial,sans-serif;font-size:34px;font-weight:700;fill:#273896}
      .label{font-family:Barlow,Arial,sans-serif;font-size:24px;font-weight:700;fill:#273896}
      .small{font-family:Barlow,Arial,sans-serif;font-size:18px;font-weight:400;fill:#273896}
      .mini{font-family:Barlow,Arial,sans-serif;font-size:16px;font-weight:400;fill:#000}
      .box{fill:#fff;stroke:#273896;stroke-width:3}
      .soft{fill:#f7f9ff;stroke:#1A73E8;stroke-width:2}
      .arrow{stroke:#273896;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .dashed{stroke:#F0242B;stroke-width:3;fill:none;stroke-dasharray:8 7}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#273896"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="460" fill="#fff"/>
  <text x="40" y="54" class="title">Few-Shot Open-Set Protocol</text>
  <line x1="40" y1="75" x2="1240" y2="75" stroke="#1A73E8" stroke-width="3"/>

  <rect x="55" y="125" width="260" height="245" rx="8" class="box"/>
  <text x="185" y="165" text-anchor="middle" class="label">Support Set</text>
  <text x="185" y="195" text-anchor="middle" class="small">k = 10 examples / keyword</text>
  <g transform="translate(93 225)">
    <circle cx="0" cy="0" r="16" fill="#273896"/><circle cx="45" cy="0" r="16" fill="#273896"/><circle cx="90" cy="0" r="16" fill="#273896"/>
    <circle cx="0" cy="58" r="16" fill="#F0242B"/><circle cx="45" cy="58" r="16" fill="#F0242B"/><circle cx="90" cy="58" r="16" fill="#F0242B"/>
    <circle cx="0" cy="116" r="16" fill="#1A73E8"/><circle cx="45" cy="116" r="16" fill="#1A73E8"/><circle cx="90" cy="116" r="16" fill="#1A73E8"/>
  </g>

  <rect x="395" y="125" width="220" height="245" rx="8" class="soft"/>
  <text x="505" y="165" text-anchor="middle" class="label">Prototypes</text>
  <text x="505" y="195" text-anchor="middle" class="small">class centroids</text>
  <circle cx="505" cy="245" r="20" fill="#273896"/>
  <circle cx="455" cy="310" r="20" fill="#F0242B"/>
  <circle cx="555" cy="310" r="20" fill="#1A73E8"/>
  <text x="505" y="390" text-anchor="middle" class="mini">computed from support embeddings</text>

  <rect x="695" y="125" width="220" height="245" rx="8" class="box"/>
  <text x="805" y="165" text-anchor="middle" class="label">Query Audio</text>
  <text x="805" y="195" text-anchor="middle" class="small">known or unknown</text>
  <circle cx="805" cy="272" r="24" fill="#fff" stroke="#F0242B" stroke-width="5"/>
  <path d="M760 330 C775 306,790 354,805 330 S835 354,850 330" stroke="#273896" stroke-width="4" fill="none"/>

  <rect x="995" y="125" width="230" height="245" rx="8" class="soft"/>
  <text x="1110" y="165" text-anchor="middle" class="label">Open-Set Decision</text>
  <text x="1110" y="199" text-anchor="middle" class="small">min distance ≤ threshold</text>
  <line x1="1040" y1="250" x2="1180" y2="250" stroke="#273896" stroke-width="4"/>
  <circle cx="1080" cy="250" r="12" fill="#273896"/>
  <circle cx="1148" cy="250" r="12" fill="#F0242B"/>
  <path d="M1110 214 L1110 286" class="dashed"/>
  <text x="1078" y="318" text-anchor="middle" class="small">accept</text>
  <text x="1150" y="318" text-anchor="middle" class="small">reject</text>

  <path d="M315 248 L390 248" class="arrow"/>
  <path d="M615 248 L690 248" class="arrow"/>
  <path d="M915 248 L990 248" class="arrow"/>
</svg>
