<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460">
  <defs>
    <style>
      .title{font-family:Barlow,Arial,sans-serif;font-size:34px;font-weight:700;fill:#273896}
      .label{font-family:Barlow,Arial,sans-serif;font-size:24px;font-weight:700;fill:#273896}
      .small{font-family:Barlow,Arial,sans-serif;font-size:18px;font-weight:400;fill:#273896}
      .mini{font-family:Barlow,Arial,sans-serif;font-size:16px;font-weight:400;fill:#000}
      .box{fill:#fff;stroke:#273896;stroke-width:3}
      .soft{fill:#f7f9ff;stroke:#1A73E8;stroke-width:2}
      .accent{fill:#F0242B}
      .navy{fill:#273896}
      .arrow{stroke:#273896;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .arrow-red{stroke:#F0242B;stroke-width:4;fill:none;marker-end:url(#arrow-red)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#273896"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F0242B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="460" fill="#fff"/>
  <text x="40" y="54" class="title">System Pipeline</text>
  <line x1="40" y1="75" x2="1240" y2="75" stroke="#1A73E8" stroke-width="3"/>

  <rect x="55" y="145" width="150" height="120" rx="8" class="box"/>
  <text x="130" y="186" text-anchor="middle" class="label">Audio</text>
  <text x="130" y="216" text-anchor="middle" class="small">1-second clip</text>
  <path d="M80 239 C95 215,110 263,125 239 S155 263,170 239 S190 215,200 239" stroke="#F0242B" stroke-width="4" fill="none"/>

  <rect x="275" y="145" width="170" height="120" rx="8" class="soft"/>
  <text x="360" y="184" text-anchor="middle" class="label">Frontend</text>
  <text x="360" y="216" text-anchor="middle" class="small">MFCC / PCEN</text>
  <text x="360" y="242" text-anchor="middle" class="mini">time-frequency features</text>

  <rect x="515" y="145" width="180" height="120" rx="8" class="box"/>
  <text x="605" y="184" text-anchor="middle" class="label">Encoder</text>
  <text x="605" y="216" text-anchor="middle" class="small">DSCNN-L</text>
  <text x="605" y="242" text-anchor="middle" class="small">EdgeSpotFull T4</text>

  <rect x="765" y="145" width="170" height="120" rx="8" class="soft"/>
  <text x="850" y="184" text-anchor="middle" class="label">Embedding</text>
  <text x="850" y="216" text-anchor="middle" class="small">L2-normalized</text>
  <circle cx="810" cy="240" r="7" class="navy"/>
  <circle cx="836" cy="230" r="7" class="accent"/>
  <circle cx="864" cy="246" r="7" class="navy"/>
  <circle cx="890" cy="235" r="7" class="accent"/>

  <rect x="1005" y="105" width="220" height="190" rx="8" class="box"/>
  <text x="1115" y="146" text-anchor="middle" class="label">Decision</text>
  <text x="1115" y="180" text-anchor="middle" class="small">Nearest prototype</text>
  <text x="1115" y="210" text-anchor="middle" class="small">+ threshold</text>
  <rect x="1040" y="232" width="70" height="36" rx="18" fill="#273896"/>
  <text x="1075" y="256" text-anchor="middle" font-family="Barlow,Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">ACCEPT</text>
  <rect x="1120" y="232" width="70" height="36" rx="18" fill="#F0242B"/>
  <text x="1155" y="256" text-anchor="middle" font-family="Barlow,Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">REJECT</text>

  <path d="M205 205 L270 205" class="arrow"/>
  <path d="M445 205 L510 205" class="arrow"/>
  <path d="M695 205 L760 205" class="arrow"/>
  <path d="M935 205 L1000 205" class="arrow"/>

  <rect x="275" y="330" width="420" height="70" rx="8" fill="#fff" stroke="#F0242B" stroke-width="2"/>
  <text x="485" y="358" text-anchor="middle" class="small">Training learns the embedding space</text>
  <text x="485" y="385" text-anchor="middle" class="mini">Triplet / SCAF / GE2E / SCAF + GE2E</text>
  <path d="M485 330 L485 270" class="arrow-red"/>
</svg>
