<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500">
  <defs>
    <style>
      .title{font-family:Barlow,Arial,sans-serif;font-size:34px;font-weight:700;fill:#273896}
      .subtitle{font-family:Barlow,Arial,sans-serif;font-size:18px;font-weight:400;fill:#273896}
      .head{font-family:Barlow,Arial,sans-serif;font-size:21px;font-weight:700;fill:#fff}
      .rowhead{font-family:Barlow,Arial,sans-serif;font-size:19px;font-weight:700;fill:#273896}
      .rowhint{font-family:Barlow,Arial,sans-serif;font-size:15px;font-weight:400;fill:#000}
      .score{font-family:Canva Sans,Arial,sans-serif;font-size:25px;font-weight:700;fill:#273896}
      .score-red{font-family:Canva Sans,Arial,sans-serif;font-size:25px;font-weight:700;fill:#F0242B}
      .loss{font-family:Barlow,Arial,sans-serif;font-size:15px;font-weight:400;fill:#000}
      .cell{fill:#fff;stroke:#d7dceb;stroke-width:2}
      .muted{fill:#f7f9ff;stroke:#d7dceb;stroke-width:2}
      .best{fill:#fff5f5;stroke:#F0242B;stroke-width:3}
      .compact{fill:#fff;stroke:#F0242B;stroke-width:3}
      .collapse{fill:#f5f5f5;stroke:#d7dceb;stroke-width:2}
      .note{font-family:Barlow,Arial,sans-serif;font-size:16px;font-weight:400;fill:#273896}
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="500" fill="#fff"/>
  <text x="40" y="54" class="title">Experiment Matrix</text>
  <text x="405" y="54" class="subtitle">16-pipeline screen, test100 ACC@1%FAR (%)</text>
  <line x1="40" y1="75" x2="1240" y2="75" stroke="#1A73E8" stroke-width="3"/>

  <rect x="100" y="105" width="1080" height="46" fill="#273896"/>
  <text x="235" y="135" text-anchor="middle" class="head">Encoder + Frontend</text>
  <text x="460" y="135" text-anchor="middle" class="head">Triplet</text>
  <text x="640" y="135" text-anchor="middle" class="head">SCAF</text>
  <text x="820" y="135" text-anchor="middle" class="head">GE2E</text>
  <text x="1030" y="135" text-anchor="middle" class="head">SCAF + GE2E</text>

  <g>
    <rect x="100" y="151" width="270" height="76" class="muted"/>
    <text x="235" y="181" text-anchor="middle" class="rowhead">DSCNN-L + MFCC</text>
    <text x="235" y="207" text-anchor="middle" class="rowhint">baseline frontend</text>

    <rect x="370" y="151" width="180" height="76" class="cell"/>
    <text x="460" y="181" text-anchor="middle" class="score">71.52</text>
    <text x="460" y="207" text-anchor="middle" class="loss">Triplet</text>

    <rect x="550" y="151" width="180" height="76" class="cell"/>
    <text x="640" y="181" text-anchor="middle" class="score">70.08</text>
    <text x="640" y="207" text-anchor="middle" class="loss">SCAF</text>

    <rect x="730" y="151" width="180" height="76" class="cell"/>
    <text x="820" y="181" text-anchor="middle" class="score">77.08</text>
    <text x="820" y="207" text-anchor="middle" class="loss">GE2E</text>

    <rect x="910" y="151" width="270" height="76" class="cell"/>
    <text x="1045" y="181" text-anchor="middle" class="score">69.04</text>
    <text x="1045" y="207" text-anchor="middle" class="loss">SCAF + GE2E</text>
  </g>

  <g>
    <rect x="100" y="227" width="270" height="76" class="muted"/>
    <text x="235" y="257" text-anchor="middle" class="rowhead">DSCNN-L + PCEN</text>
    <text x="235" y="283" text-anchor="middle" class="rowhint">strongest screening branch</text>

    <rect x="370" y="227" width="180" height="76" class="cell"/>
    <text x="460" y="257" text-anchor="middle" class="score">79.98</text>
    <text x="460" y="283" text-anchor="middle" class="loss">Triplet</text>

    <rect x="550" y="227" width="180" height="76" class="collapse"/>
    <text x="640" y="257" text-anchor="middle" class="score">69.44</text>
    <text x="640" y="283" text-anchor="middle" class="loss">collapsed</text>

    <rect x="730" y="227" width="180" height="76" class="best"/>
    <text x="820" y="257" text-anchor="middle" class="score-red">82.34</text>
    <text x="820" y="283" text-anchor="middle" class="loss">best screen</text>

    <rect x="910" y="227" width="270" height="76" class="collapse"/>
    <text x="1045" y="257" text-anchor="middle" class="score">69.44</text>
    <text x="1045" y="283" text-anchor="middle" class="loss">collapsed</text>
  </g>

  <g>
    <rect x="100" y="303" width="270" height="76" class="muted"/>
    <text x="235" y="333" text-anchor="middle" class="rowhead">EdgeSpotFull T4 + MFCC</text>
    <text x="235" y="359" text-anchor="middle" class="rowhint">compact, MFCC check</text>

    <rect x="370" y="303" width="180" height="76" class="cell"/>
    <text x="460" y="333" text-anchor="middle" class="score">69.63</text>
    <text x="460" y="359" text-anchor="middle" class="loss">Triplet</text>

    <rect x="550" y="303" width="180" height="76" class="collapse"/>
    <text x="640" y="333" text-anchor="middle" class="score">69.44</text>
    <text x="640" y="359" text-anchor="middle" class="loss">collapsed</text>

    <rect x="730" y="303" width="180" height="76" class="cell"/>
    <text x="820" y="333" text-anchor="middle" class="score">70.76</text>
    <text x="820" y="359" text-anchor="middle" class="loss">GE2E</text>

    <rect x="910" y="303" width="270" height="76" class="cell"/>
    <text x="1045" y="333" text-anchor="middle" class="score">69.67</text>
    <text x="1045" y="359" text-anchor="middle" class="loss">SCAF + GE2E</text>
  </g>

  <g>
    <rect x="100" y="379" width="270" height="76" class="muted"/>
    <text x="235" y="409" text-anchor="middle" class="rowhead">EdgeSpotFull T4 + PCEN</text>
    <text x="235" y="435" text-anchor="middle" class="rowhint">best compact screening branch</text>

    <rect x="370" y="379" width="180" height="76" class="cell"/>
    <text x="460" y="409" text-anchor="middle" class="score">79.58</text>
    <text x="460" y="435" text-anchor="middle" class="loss">Triplet</text>

    <rect x="550" y="379" width="180" height="76" class="collapse"/>
    <text x="640" y="409" text-anchor="middle" class="score">69.44</text>
    <text x="640" y="435" text-anchor="middle" class="loss">collapsed</text>

    <rect x="730" y="379" width="180" height="76" class="compact"/>
    <text x="820" y="409" text-anchor="middle" class="score-red">79.98</text>
    <text x="820" y="435" text-anchor="middle" class="loss">compact best</text>

    <rect x="910" y="379" width="270" height="76" class="collapse"/>
    <text x="1045" y="409" text-anchor="middle" class="score">69.44</text>
    <text x="1045" y="435" text-anchor="middle" class="loss">collapsed</text>
  </g>

  <text x="100" y="482" class="note">Use this slide for the broad screening result. Put the later ep300 composite headline on the main-result slide.</text>
</svg>
