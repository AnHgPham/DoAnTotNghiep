<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460">
  <defs>
    <style>
      .title{font-family:Barlow,Arial,sans-serif;font-size:34px;font-weight:700;fill:#273896}
      .label{font-family:Barlow,Arial,sans-serif;font-size:25px;font-weight:700;fill:#273896}
      .small{font-family:Barlow,Arial,sans-serif;font-size:18px;font-weight:400;fill:#273896}
      .mini{font-family:Barlow,Arial,sans-serif;font-size:15px;font-weight:400;fill:#000}
      .box{fill:#fff;stroke:#273896;stroke-width:3}
      .soft{fill:#f7f9ff;stroke:#1A73E8;stroke-width:2}
      .red{fill:#F0242B}
      .blue{fill:#273896}
      .line{stroke:#273896;stroke-width:3;fill:none}
      .dash{stroke:#F0242B;stroke-width:3;fill:none;stroke-dasharray:8 8}
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="460" fill="#fff"/>
  <text x="40" y="54" class="title">Training Objective Overview</text>
  <line x1="40" y1="75" x2="1240" y2="75" stroke="#1A73E8" stroke-width="3"/>

  <rect x="55" y="120" width="260" height="250" rx="8" class="box"/>
  <text x="185" y="163" text-anchor="middle" class="label">Triplet Loss</text>
  <text x="185" y="198" text-anchor="middle" class="small">pull positives closer</text>
  <text x="185" y="224" text-anchor="middle" class="small">push negatives apart</text>
  <circle cx="145" cy="285" r="14" class="blue"/>
  <circle cx="188" cy="273" r="14" class="blue"/>
  <circle cx="235" cy="310" r="14" class="red"/>
  <path d="M145 285 L188 273" class="line"/>
  <path d="M188 273 L235 310" class="dash"/>
  <text x="185" y="342" text-anchor="middle" class="mini">margin-based metric learning</text>

  <rect x="365" y="120" width="260" height="250" rx="8" class="soft"/>
  <text x="495" y="163" text-anchor="middle" class="label">SCAF</text>
  <text x="495" y="198" text-anchor="middle" class="small">sub-centers per class</text>
  <text x="495" y="224" text-anchor="middle" class="small">model intra-class variation</text>
  <circle cx="460" cy="284" r="13" class="blue"/>
  <circle cx="500" cy="268" r="13" class="blue"/>
  <circle cx="535" cy="296" r="13" class="blue"/>
  <circle cx="455" cy="325" r="9" fill="#fff" stroke="#F0242B" stroke-width="4"/>
  <circle cx="510" cy="325" r="9" fill="#fff" stroke="#F0242B" stroke-width="4"/>
  <circle cx="565" cy="325" r="9" fill="#fff" stroke="#F0242B" stroke-width="4"/>
  <text x="495" y="360" text-anchor="middle" class="mini">sensitive in large-vocabulary runs</text>

  <rect x="675" y="120" width="260" height="250" rx="8" class="box"/>
  <text x="805" y="163" text-anchor="middle" class="label">GE2E</text>
  <text x="805" y="198" text-anchor="middle" class="small">compare utterances</text>
  <text x="805" y="224" text-anchor="middle" class="small">to class centroids</text>
  <circle cx="760" cy="280" r="13" class="blue"/>
  <circle cx="792" cy="260" r="13" class="blue"/>
  <circle cx="824" cy="280" r="13" class="blue"/>
  <circle cx="792" cy="308" r="20" fill="none" stroke="#F0242B" stroke-width="4"/>
  <line x1="792" y1="260" x2="792" y2="308" class="line"/>
  <text x="805" y="360" text-anchor="middle" class="mini">stable for few-shot prototypes</text>

  <rect x="985" y="120" width="240" height="250" rx="8" class="soft"/>
  <text x="1105" y="163" text-anchor="middle" class="label">Hybrid</text>
  <text x="1105" y="198" text-anchor="middle" class="small">SCAF + GE2E</text>
  <text x="1105" y="224" text-anchor="middle" class="small">tested combination</text>
  <rect x="1040" y="260" width="130" height="42" rx="21" fill="#273896"/>
  <text x="1105" y="288" text-anchor="middle" font-family="Barlow,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">joint loss</text>
  <text x="1105" y="360" text-anchor="middle" class="mini">not always additive in practice</text>
</svg>
