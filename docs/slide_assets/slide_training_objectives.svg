<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460"><defs><style>.label{font-weight:700;fill:#273896}.label,.mini,.small,.title{font-family:Barlow,Arial,sans-serif}.small,.title{fill:#273896}.title{font-size:34px;font-weight:700}.label{font-size:25px}.mini,.small{font-weight:400}.small{font-size:18px}.mini{font-size:15px;fill:#000}.box{fill:#fff;stroke:#273896;stroke-width:3}.soft{fill:#f7f9ff;stroke:#1a73e8;stroke-width:2}.red{fill:#f0242b}.blue{fill:#273896}.dash,.line{stroke-width:3;fill:none}.line{stroke:#273896}.dash{stroke:#f0242b;stroke-dasharray:8 8}</style></defs><rect width="1280" height="460" x="0" y="0" fill="#fff"/><text x="40" y="54" class="title">Training Objective Overview</text><line x1="40" x2="1240" y1="75" y2="75" stroke="#1A73E8" stroke-width="3"/><rect width="260" height="250" x="55" y="120" class="box" rx="8"/><text x="185" y="163" class="label" text-anchor="middle">Triplet Loss</text><text x="185" y="198" class="small" text-anchor="middle">pull positives closer</text><text x="185" y="224" class="small" text-anchor="middle">push negatives apart</text><circle cx="145" cy="285" r="14" class="blue"/><circle cx="188" cy="273" r="14" class="blue"/><circle cx="235" cy="310" r="14" class="red"/><path d="M145 285 L188 273" class="line"/><path d="M188 273 L235 310" class="dash"/><text x="185" y="342" class="mini" text-anchor="middle">margin-based metric learning</text><rect width="260" height="250" x="365" y="120" class="soft" rx="8"/><text x="495" y="163" class="label" text-anchor="middle">SCAF</text><text x="495" y="198" class="small" text-anchor="middle">sub-centers per class</text><text x="495" y="224" class="small" text-anchor="middle">model intra-class variation</text><circle cx="460" cy="284" r="13" class="blue"/><circle cx="500" cy="268" r="13" class="blue"/><circle cx="535" cy="296" r="13" class="blue"/><circle cx="455" cy="325" r="9" fill="#fff" stroke="#F0242B" stroke-width="4"/><circle cx="510" cy="325" r="9" fill="#fff" stroke="#F0242B" stroke-width="4"/><circle cx="565" cy="325" r="9" fill="#fff" stroke="#F0242B" stroke-width="4"/><text x="495" y="360" class="mini" text-anchor="middle">sensitive in large-vocabulary runs</text><rect width="260" height="250" x="675" y="120" class="box" rx="8"/><text x="805" y="163" class="label" text-anchor="middle">GE2E</text><text x="805" y="198" class="small" text-anchor="middle">compare utterances</text><text x="805" y="224" class="small" text-anchor="middle">to class centroids</text><circle cx="760" cy="280" r="13" class="blue"/><circle cx="792" cy="260" r="13" class="blue"/><circle cx="824" cy="280" r="13" class="blue"/><circle cx="792" cy="308" r="20" fill="none" stroke="#F0242B" stroke-width="4"/><line x1="792" x2="792" y1="260" y2="308" class="line"/><text x="805" y="360" class="mini" text-anchor="middle">stable for few-shot prototypes</text><rect width="240" height="250" x="985" y="120" class="soft" rx="8"/><text x="1105" y="163" class="label" text-anchor="middle">Hybrid</text><text x="1105" y="198" class="small" text-anchor="middle">SCAF + GE2E</text><text x="1105" y="224" class="small" text-anchor="middle">tested combination</text><rect width="130" height="42" x="1040" y="260" fill="#273896" rx="21"/><text x="1105" y="288" fill="#fff" font-family="Barlow,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle">joint loss</text><text x="1105" y="360" class="mini" text-anchor="middle">not always additive in practice</text></svg>