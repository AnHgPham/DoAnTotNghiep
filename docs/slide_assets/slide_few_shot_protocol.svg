<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460"><defs><style>.label{font-weight:700;fill:#273896}.label,.mini,.small,.title{font-family:Barlow,Arial,sans-serif}.small,.title{fill:#273896}.title{font-size:34px;font-weight:700}.label{font-size:24px}.mini,.small{font-weight:400}.small{font-size:18px}.mini{font-size:16px;fill:#000}.box{fill:#fff;stroke:#273896;stroke-width:3}.soft{fill:#f7f9ff;stroke:#1a73e8;stroke-width:2}.arrow{stroke:#273896;stroke-width:4;fill:none;marker-end:url(#arrow)}.dashed{stroke:#f0242b;stroke-width:3;fill:none;stroke-dasharray:8 7}</style><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#273896" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><rect width="1280" height="460" x="0" y="0" fill="#fff"/><text x="40" y="54" class="title">Few-Shot Open-Set Protocol</text><line x1="40" x2="1240" y1="75" y2="75" stroke="#1A73E8" stroke-width="3"/><rect width="260" height="245" x="55" y="125" class="box" rx="8"/><text x="185" y="165" class="label" text-anchor="middle">Support Set</text><text x="185" y="195" class="small" text-anchor="middle">k = 10 examples / keyword</text><g transform="translate(93 225)"><circle cx="0" cy="0" r="16" fill="#273896"/><circle cx="45" cy="0" r="16" fill="#273896"/><circle cx="90" cy="0" r="16" fill="#273896"/><circle cx="0" cy="58" r="16" fill="#F0242B"/><circle cx="45" cy="58" r="16" fill="#F0242B"/><circle cx="90" cy="58" r="16" fill="#F0242B"/><circle cx="0" cy="116" r="16" fill="#1A73E8"/><circle cx="45" cy="116" r="16" fill="#1A73E8"/><circle cx="90" cy="116" r="16" fill="#1A73E8"/></g><rect width="220" height="245" x="395" y="125" class="soft" rx="8"/><text x="505" y="165" class="label" text-anchor="middle">Prototypes</text><text x="505" y="195" class="small" text-anchor="middle">class centroids</text><circle cx="505" cy="245" r="20" fill="#273896"/><circle cx="455" cy="310" r="20" fill="#F0242B"/><circle cx="555" cy="310" r="20" fill="#1A73E8"/><text x="505" y="390" class="mini" text-anchor="middle">computed from support embeddings</text><rect width="220" height="245" x="695" y="125" class="box" rx="8"/><text x="805" y="165" class="label" text-anchor="middle">Query Audio</text><text x="805" y="195" class="small" text-anchor="middle">known or unknown</text><circle cx="805" cy="272" r="24" fill="#fff" stroke="#F0242B" stroke-width="5"/><path fill="none" stroke="#273896" stroke-width="4" d="M760 330 C775 306,790 354,805 330 S835 354,850 330"/><rect width="230" height="245" x="995" y="125" class="soft" rx="8"/><text x="1110" y="165" class="label" text-anchor="middle">Open-Set Decision</text><text x="1110" y="199" class="small" text-anchor="middle">min distance ≤ threshold</text><line x1="1040" x2="1180" y1="250" y2="250" stroke="#273896" stroke-width="4"/><circle cx="1080" cy="250" r="12" fill="#273896"/><circle cx="1148" cy="250" r="12" fill="#F0242B"/><path d="M1110 214 L1110 286" class="dashed"/><text x="1078" y="318" class="small" text-anchor="middle">accept</text><text x="1150" y="318" class="small" text-anchor="middle">reject</text><path d="M315 248 L390 248" class="arrow"/><path d="M615 248 L690 248" class="arrow"/><path d="M915 248 L990 248" class="arrow"/></svg>